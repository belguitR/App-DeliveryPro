applications:
  deliverypro:
    source:
      root: "./backend"
    type: "java:19"
    relationships:
      postgresql: "postgresql:default"
    web:
      commands:
        start: "java -jar backend/server/target/server-1.0-SNAPSHOT.jar"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true
    build:
      flavor: none
    hooks:
      build: |
        set -eux
        # Add any build steps here if needed
      deploy: |
        set -eux
        # Add any deploy-time commands here if needed

services:
  postgresql:
    type: postgresql:15

routes:
  "https://{default}/":
    type: upstream
    upstream: "deliverypro:http"
  "https://www.{default}":
    type: redirect
    to: "https://{default}/"
