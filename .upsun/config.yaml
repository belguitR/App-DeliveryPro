applications:
  deliverypro:
    source:
      root: "./backend" # <-- Make sure this is correct relative to config.yaml
    type: "java:19"
    relationships:
      postgresql: "postgresql:default"
    web:
      commands:
        start: "java -jar backend/server/target/server-1.0-SNAPSHOT.jar"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true
    build:
      flavor: none
    hooks:
      build: |
        set -eux
        echo "== Project root listing =="
        ls -al /
        echo "== App source folder listing =="
        ls -al ./backend
        # Add any build steps here if needed
      deploy: |
        set -eux
        echo "== Deploy hook running =="
        # Add any deploy-time commands here if needed

services:
  postgresql:
    type: postgresql:15

routes:
  "https://{default}/":
    type: upstream
    upstream: "deliverypro:http"
  "https://www.{default}":
    type: redirect
    to: "https://{default}/"
