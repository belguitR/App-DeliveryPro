applications:
  deliverypro:
    # Points to the directory containing your Spring Boot app
    source:
      root: "./backend"
    # Use the desired Java runtime version
    type: "java:19"
    # The relationship key here tells Upsun to inject PostgreSQL connection info
    relationships:
      postgresql: "postgresql:default"
    web:
      commands:
        # Replace 'backend.jar' with your actual built jar filename.
        start: "java -jar backend/server/target/server-1.0-SNAPSHOT.jar"
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true
    build:
      flavor: none
    hooks:
      build: |
        set -eux
        # Add any build steps here if needed (for example, compiling assets)
      deploy: |
        set -eux
        # Add any deploy-time commands here if needed

services:
  postgresql:
    type: postgresql:15
    # These variables set up your PostgreSQL instance like in your docker-compose
    variables:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: local

routes:
  "https://{default}/":
    type: upstream
    upstream: "deliverypro:http"
  "https://www.{default}":
    type: redirect
    to: "https://{default}/"
