<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mobilis - Choisissez votre rôle</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #eceff1 0%, #cfd8dc 100%);
        font-family: "Roboto", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        background-color: white;
        padding: 50px 40px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
        width: 360px;
        z-index: 1;
      }

      h1 {
        font-size: 36px;
        font-weight: 700;
        color: #1a237e;
        margin-bottom: 10px;
      }

      h2 {
        font-size: 18px;
        font-weight: 400;
        color: #546e7a;
        margin-bottom: 35px;
      }

      .role-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        background-color: #3949ab;
        color: white;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          transform 0.3s ease,
          box-shadow 0.3s ease;
        text-decoration: none;
        box-sizing: border-box;
      }

      .role-button:hover {
        background-color: #283593;
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      }

      .role-button:focus {
        outline: 2px solid #7986cb;
        outline-offset: 2px;
      }

      .icon {
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Mobilis</h1>
      <h2>Bienvenue ! Vous êtes :</h2>

      <a href="/planificateur/" class="role-button">
        <span class="icon">⚙️</span>
        Un Planificateur
      </a>
      <a href="/livreur/" class="role-button">
        <span class="icon">🚚</span>
        Un Livreur
      </a>
    </div>
    <router-outlet></router-outlet>
  </body>
</html>
