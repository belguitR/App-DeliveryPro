<div class="planificateur-container row">
  <div class="col-12 col-md-2 sidebar p-3">

    <mat-form-field appearance="fill" class="w-100 mb-3">
      <mat-label>Date de la tournée</mat-label>
      <input matInput [matDatepicker]="picker"
             [value]="selectedDate()"
             (dateChange)="onDateChange($event)">
      <mat-hint>JJ/MM/AAAA</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="commandes-selection mt-4">
      <h5>Commandes à planifier</h5>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary"
                (click)="nombreCommandesUtilisees.set(Math.max(1, nombreCommandesUtilisees() - 1))">-</button>

        <input type="number" class="form-control form-control-sm text-center"
               style="width: 60px"
               [min]="1"
               [max]="commandesOuvertes().length"
               [value]="nombreCommandesUtilisees()"
               (input)="nombreCommandesUtilisees.set($any($event.target).valueAsNumber)">

        <button class="btn btn-sm btn-outline-secondary"
                (click)="nombreCommandesUtilisees.set(Math.min(commandesOuvertes().length, nombreCommandesUtilisees() + 1))">+</button>
      </div>
      <div class="total-disponibles">
        Total disponibles : {{ commandesOuvertes().length }}
      </div>
      
    </div>

    @for (equipe of availableEquipeLivreurs(); track equipe.numEquipe) {
      <li (click)="toggleEquipe(equipe)"
          [class.selected]="isEquipeSelected(equipe)"
          class="list-group-item d-flex align-items-center equipe-toggle">
        <div class="color-box me-2" [style.background-color]="getEquipeColor(equipe.numEquipe)"></div>
        <span>Équipe {{ equipe.numEquipe }}</span>
      </li>
    }

    <button class="btn btn-primary w-100 mt-4"
            type="button"
            (click)="creerTournees()">
      Créer Tournées
    </button>

  </div>

  <div class="col-12 col-md-10 map-wrapper p-3">
    <div class="map-frame shadow rounded">
      <app-map #mapRef
        [commandes]="displayedCommandes()"
        [createdTournees]="createdTourneesSignal()"
        [polylineColors]="polylineColorMap()"
        [selectedEquipes]="selectedEquipes()">
      </app-map>


      <button class="btn btn-secondary mt-2 w-100" (click)="mapRef.clearTournees()">
        Actualiser les commandes affichées
      </button>
      
      
      
    </div>
  </div>
</div>
